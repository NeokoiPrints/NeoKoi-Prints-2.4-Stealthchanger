# This file contains common pin mappings for the Nitehawk36 V1.4.
# To use this config, the firmware should be compiled for the 
# Raspberry Pi RP2040".

# change the mcu section name to the tool board you are configuring:
# NHK4, NHK4, etc.
[mcu NHK4]
serial: /dev/serial/by-id/usb-Klipper_rp2040_tool4-if00
restart_method: command

# change the accelerometer section name to the tool you are configuring:
# T4, T4, etc.
[adxl345 T4]
cs_pin: NHK4:gpio27
spi_software_sclk_pin: NHK4:gpio18
spi_software_mosi_pin: NHK4:gpio20
spi_software_miso_pin: NHK4:gpio19
axes_map: x,z,y

# change to the extruder section you are configuring:
# extruder, extruder4, etc.
[extruder4] # Orbiter2.5 with CHCB-V Hotend
step_pin: NHK4:gpio23
dir_pin: !NHK4:gpio24
enable_pin: !NHK4:gpio25
heater_pin: NHK4:gpio9
sensor_pin: NHK4:gpio29
microsteps: 16
rotation_distance: 5.29
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 340
pressure_advance: 0
sensor_type:  PT1000
pullup_resistor: 2200
control: pid
pid_Kp: 30.410
pid_Ki: 3.342
pid_Kd: 69.184

# change the tmc2209 section name to match the extruder you are configuring:
# extruder, extruder4, etc.
[tmc2209 extruder4] # Orbiter2.5
uart_pin: NHK4:gpio0
tx_pin: NHK4:gpio1
sense_resistor: 0.100
run_current: 0.675
interpolate: False
stealthchop_threshold: 0

# change the heater_fan section name to match the tool you are configuring:
# T4_hotend_fan, T4_hotend_fan, etc.
[heater_fan T4_hotend_fan]
pin: NHK4:gpio5
heater: extruder4 # change to match the extruder you are configuring: extruder, extruder4, etc.
heater_temp: 50.0

# change the fan_generic section name to the tool you are configuring:
# T4_partfan, T4_partfan, etc.
[fan_generic T4_part_fan]
pin: NHK4:gpio6

# change the tool section name to the tool you are configuring:
# T4, T4, etc.
[tool T4]
tool_number: 4 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder4 # change to match the extruder you are configuring: extruder, extruder4, etc.
fan: T4_part_fan
params_park_x: 277.50
params_park_y: 12.10
params_park_z: 296.00
gcode_x_offset: -0.100
gcode_y_offset: 0.520
gcode_z_offset: -0.009
detection_pin: !NHK4:gpio10

# Results from input shaper
params_input_shaper_type_x: '2hump_el'
params_input_shaper_freq_x: 77.6
params_input_shaper_damping_ratio_x: 0.083
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 32.8
params_input_shaper_damping_ratio_y: 0.082


# change the tool_probe section name to the tool you are configuring:
# T4, T4, etc.
# [tool_probe T4]
# pin: NHK4:gpio10
# tool: 0 # change to the index of the tool. 0, 1, 2, etc.
# z_offset = -0.9
# speed: 5.0
# samples: 3
# samples_result: median
# sample_retract_dist: 2.0
# samples_tolerance: 0.02
# samples_tolerance_retries: 3
# activate_gcode:
#     _TAP_PROBE_ACTIVATE HEATER=extruder # change to match the extruder you are configuring: extruder, extruder4, etc.

# change the neopixel section name to the tool you are configuring:
# T4, T4, etc.
[neopixel T4]
pin: NHK4:gpio7
color_order: GRBW
chain_count: 3
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1
initial_WHITE: 1.0

# change the gcode_macro section name to the tool you are configuring:
# T4, T4, etc.
[gcode_macro T4]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
gcode:
    SELECT_TOOL T=4 # change to the index of the tool. 0, 1, 2, etc.
