[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_100034001451313430323835-if00
restart_method: command

[stepper_x] # S2
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
rotation_distance: 40
microsteps: 64 #32
full_steps_per_rotation:400
endstop_pin: ^PC15 #tmc5160_stepper_x:virtual_endstop
position_min: -5
position_endstop: 350
position_max: 350
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: True

[tmc5160 stepper_x]
cs_pin: PD5
interpolate: false
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
sense_resistor: 0.050
run_current: 0.8 # 1.0
stealthchop_threshold: 0
# diag1_pin: ^!PC15

[stepper_y]  # S1
step_pin: PC14
dir_pin: !PC13
enable_pin: !PE6
rotation_distance: 40
microsteps: 64 #32
full_steps_per_rotation:400
endstop_pin: ^PF0
position_min: -1
position_endstop: 350
position_max: 350
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PD6
interpolate: false
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
sense_resistor: 0.050
run_current: 0.8 # 1.0
stealthchop_threshold: 0

# Z0 - Front Left - S8
[stepper_z3]
step_pin: PG9
dir_pin: PG10
enable_pin: !PG13
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64 #32


[tmc5160 stepper_z3]
cs_pin: PD2
interpolate: false
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
sense_resistor: 0.075
run_current: 0.8
stealthchop_threshold: 0

# Z1 - Rear Left - S7
[stepper_z2]
step_pin: PG11
dir_pin: !PD7
enable_pin: !PG12
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64 #32

[tmc5160 stepper_z2]
cs_pin: PA15
interpolate: false
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
sense_resistor: 0.075
run_current: 0.8
stealthchop_threshold: 0

# Z2 - Rear Right - S6
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64 #32

[tmc5160 stepper_z1]
cs_pin: PA9
interpolate: false
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
sense_resistor: 0.075
run_current: 0.8
stealthchop_threshold: 0

# Z3 - Front Right - S5
[stepper_z]
step_pin: PG15
dir_pin: !PB6
enable_pin: !PG14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64 #32
endstop_pin: probe:z_virtual_endstop
position_max: 350
position_min: -50
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 0

[tmc5160 stepper_z]
cs_pin: PA10
interpolate: false
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
sense_resistor: 0.075
run_current: 0.8
stealthchop_threshold: 0

[heater_bed]
heater_pin: PF5
sensor_type: Generic 3950
sensor_pin: PB0
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769
pwm_cycle_time: 0.01667

[multi_pin controller_fan_pins]
pins: PA1, PA3

[temperature_fan controller_fans]
pin: multi_pin:controller_fan_pins
sensor_type: temperature_mcu
control: watermark
min_temp: 0
max_temp: 100
target_temp: 50
max_speed: 1.0
min_speed: 0.0

[fan_generic bed_fans]
pin: PA2
max_power: 1.0
