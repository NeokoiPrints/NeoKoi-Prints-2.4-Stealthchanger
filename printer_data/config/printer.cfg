[include mainsail.cfg]
[include kraken.cfg]
[include prime_lines.cfg]
[include toolchanger/readonly-configs/toolchanger-include.cfg]
[include macros.cfg]
[include shaketune.cfg]
[include axiscope.cfg]
[include birdsnest.cfg]
[include klipperautospeed.cfg]

# [save_variables]
# filename: ~/variables.cfg

[exclude_object]

[idle_timeout]
timeout: 1800

[bed_mesh]
speed: 600
horizontal_move_z: 1
mesh_min: 30, 80
mesh_max: 320,300
fade_start: 0 #0.6
fade_end: 0 #10.0
probe_count: 10,10
algorithm: bicubic
zero_reference_position: 175, 175

[printer]
kinematics: corexy
max_velocity: 500 
max_accel: 15000
max_z_velocity: 350 #300 #350 N3mi max
max_z_accel: 3500 #3000 #3500
square_corner_velocity: 5.0

[quad_gantry_level]
gantry_corners:
  -60,-10
  410,420
points:
   30,5
   30,300
   320,300
   320,5

speed: 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 5

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2.0  # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup#
    {% endif %}


[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_41430D745157355957202020FF0E3610-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 41.1 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
default_probe_method: proximity

